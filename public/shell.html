<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Cashflow</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: oklch(0.994 0 0);
      }
      body.dark {
        background: oklch(0.1448 0 0);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 16px;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <img src="/icon-192x192.png" alt="" />
    <script>
      var t = null;
      try {
        t = localStorage.getItem("theme");
      } catch (e) {}
      if (
        t === "dark" ||
        ((!t || t === "system") &&
          matchMedia("(prefers-color-scheme: dark)").matches)
      )
        document.body.className = "dark";
      var u = new URL(location.href);
      u.searchParams.set("_s", "1");
      location.replace(u);
    </script>
  </body>
</html>
